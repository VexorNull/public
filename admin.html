<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Add Story</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container admin-box">
        <h2>Post New Story</h2>
        
        <form id="storyForm">
            <div class="form-group">
                <label>User / Admin Name:</label>
                <input type="text" id="authorName" placeholder="Enter name" required>
            </div>

            <div class="form-group">
                <label>Select Content Type:</label>
                <select id="contentType">
                    <option value="text">Text Only</option>
                    <option value="image">Image</option>
                    <option value="video">Video</option>
                </select>
            </div>

            <div class="form-group" id="textInputGroup">
                <label>Story Text / Caption:</label>
                <textarea id="storyText" placeholder="Write something..."></textarea>
            </div>

            <div class="form-group hidden" id="fileInputGroup">
                <label>Select File (Image / Video):</label>
                <input type="file" id="mediaFile" accept="image/*,video/*">
            </div>

            <button type="submit" id="submitBtn">Publish Story</button>
        </form>

        <a href="index.html" class="back-link">&larr; Back to Main Feed</a>
    </div>

    <script type="module" src="admin.js"></script>
</body>
</html>
