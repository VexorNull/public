<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanveer Connect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #f8fafc; color: #0f172a; padding: 15px; }
        
        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 15px 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .brand { font-weight: 700; font-size: 1.2rem; color: #4f46e5; }
        .admin-btn { background: #4f46e5; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 500; cursor: pointer; }
        
        .container { max-width: 600px; margin: 0 auto; }
        
        /* Admin Panel */
        .admin-panel { display: none; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; border: 2px solid #6366f1; }
        .admin-panel.active { display: block; }
        .form-control { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
        .submit-btn { width: 100%; padding: 10px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 5px; }
        .submit-btn:disabled { background: #94a3b8; }
        
        /* Feed Cards */
        .post-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        .post-card img { width: 100%; max-height: 400px; object-fit: cover; display: block; }
        .post-content { padding: 15px; }
        .post-time { font-size: 0.75rem; color: #64748b; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="brand"><i class="fa-solid fa-circle-check"></i> Tanveer Connect</div>
        <button class="admin-btn" id="loginAdminBtn"><i class="fa-solid fa-lock"></i> Admin Login</button>
    </div>

    <!-- Admin Upload Form -->
    <div class="admin-panel" id="adminPanel">
        <h3 style="margin-bottom: 10px;">Create New Post</h3>
        <input type="text" id="postText" class="form-control" placeholder="Write caption here...">
        <input type="file" id="postImg" class="form-control" accept="image/*">
        <button class="submit-btn" id="uploadBtn">Publish Post</button>
        <div id="statusMsg" style="margin-top: 10px; font-size: 0.85rem; font-weight: 600;"></div>
    </div>

    <!-- Live Posts Feed -->
    <h3 style="margin-bottom: 15px; color: #334155;">Live Updates Feed</h3>
    <div id="feed"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyA1S9u1f3VOdZnP6puMhCVwAG6kwL4Vu5Q",
        authDomain: "public-361f0.firebaseapp.com",
        projectId: "public-361f0",
        storageBucket: "public-361f0.firebasestorage.app",
        messagingSenderId: "519361882049",
        appId: "1:519361882049:web:fa1d69dff9d59df4f43140"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Direct PIN Admin System
    let isAdmin = false;
    const ADMIN_PIN = "1234";

    document.getElementById('loginAdminBtn').addEventListener('click', () => {
        if (!isAdmin) {
            const pin = prompt("Enter Admin Secret PIN:");
            if (pin === ADMIN_PIN) {
                isAdmin = true;
                document.getElementById('adminPanel').classList.add('active');
                document.getElementById('loginAdminBtn').innerHTML = '<i class="fa-solid fa-right-from-bracket"></i> Logout';
            } else if (pin !== null) {
                alert("Incorrect PIN Code!");
            }
        } else {
            isAdmin = false;
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('loginAdminBtn').innerHTML = '<i class="fa-solid fa-lock"></i> Admin Login';
        }
    });

    // Image Compressor to Base64
    function compressImage(file) {
        return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                const img = new Image();
                img.src = e.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const maxWidth = 800;
                    const scale = maxWidth / img.width;
                    canvas.width = maxWidth;
                    canvas.height = img.height * scale;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    resolve(canvas.toDataURL('image/jpeg', 0.7));
                };
            };
        });
    }

    // Post Upload Action
    document.getElementById('uploadBtn').addEventListener('click', async () => {
        const text = document.getElementById('postText').value;
        const fileInput = document.getElementById('postImg').files[0];
        const status = document.getElementById('statusMsg');
        const btn = document.getElementById('uploadBtn');

        if (!text || !fileInput) {
            alert('Aap caption aur image dono select karein!');
            return;
        }

        try {
            btn.disabled = true;
            status.style.color = "#d97706";
            status.innerText = "Compressing & Publishing...";

            const base64Img = await compressImage(fileInput);

            await addDoc(collection(db, "posts"), {
                text: text,
                img: base64Img,
                timestamp: Date.now()
            });

            status.style.color = "#059669";
            status.innerText = "Post Live Successfully!";
            document.getElementById('postText').value = '';
            document.getElementById('postImg').value = '';
        } catch (err) {
            status.style.color = "#dc2626";
            status.innerText = "Error: " + err.message;
        } finally {
            btn.disabled = false;
        }
    });

    // Realtime Database Fetch
    const q = query(collection(db, "posts"), orderBy("timestamp", "desc"));
    onSnapshot(q, (snapshot) => {
        const feed = document.getElementById('feed');
        feed.innerHTML = '';
        snapshot.forEach((doc) => {
            const post = doc.data();
            const timeStr = new Date(post.timestamp).toLocaleString();
            feed.innerHTML += `
                <div class="post-card">
                    <img src="${post.img}">
                    <div class="post-content">
                        <p style="font-weight: 500;">${post.text}</p>
                        <div class="post-time">${timeStr}</div>
                    </div>
                </div>
            `;
        });
    });
</script>

</body>
</html>
