<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tanveer Connect - Firebase Platform</title>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
            --border: #e2e8f0;
            --white: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--light);
            color: var(--dark);
            line-height: 1.6;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 15px;
        }

        .btn {
            padding: 10px 18px;
            background-color: var(--primary);
            color: var(--white);
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: var(--transition);
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger);
        }

        /* Header Navigation */
        header {
            background-color: var(--white);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 0;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
        }

        .admin-badge {
            background: #dcfce7;
            color: #15803d;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: none;
        }

        /* Stories System */
        .stories-container {
            background: var(--white);
            padding: 20px;
            margin: 20px 0;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .stories-wrapper {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .story-card {
            flex: 0 0 80px;
            text-align: center;
            cursor: pointer;
            position: relative;
        }

        .story-img-wrapper {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            padding: 3px;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366);
            margin: 0 auto 5px;
        }

        .story-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--white);
        }

        .story-name {
            font-size: 0.75rem;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .delete-story-btn {
            position: absolute;
            top: 0;
            right: 5px;
            background: var(--danger);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            border: none;
        }

        /* Admin Control Panel */
        .admin-panel {
            background: var(--white);
            border: 2px dashed var(--primary);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .panel-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: 600;
            color: var(--gray);
        }

        .tab-btn.active {
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
        }

        .form-control {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            outline: none;
        }

        /* Progress Bar UI */
        .progress-box {
            display: none;
            margin: 15px 0;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            height: 18px;
            position: relative;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.2s ease;
        }

        .progress-text {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            font-size: 11px; font-weight: 700; color: #fff;
            display: flex; align-items: center; justify-content: center;
            text-shadow: 0 0 3px rgba(0,0,0,0.5);
        }

        /* Feed Grid */
        .feed-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .post-card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            position: relative;
        }

        .post-header {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .post-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
        }

        .post-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
        }

        .post-content {
            padding: 15px;
        }

        .post-delete-btn {
            display: none;
            background: var(--danger);
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 2000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--white);
            padding: 20px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            text-align: center;
        }

        .modal-img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 8px;
        }

        body.admin-mode .post-delete-btn,
        body.admin-mode .delete-story-btn {
            display: flex !important;
        }

        body.admin-mode .admin-badge {
            display: inline-block;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container navbar">
            <div class="logo">Tanveer Connect <span class="admin-badge" id="adminBadge">Admin Mode</span></div>
            <div>
                <button class="btn" id="loginAdminBtn"><i class="fa-solid fa-lock"></i> Admin Login</button>
            </div>
        </div>
    </header>

    <main class="container">

        <!-- Status Stories Section -->
        <section class="stories-container">
            <h4 style="margin-bottom: 10px;">Recent Stories / Status</h4>
            <div class="stories-wrapper" id="storiesWrapper">
                <!-- Stories Loaded Here -->
            </div>
        </section>

        <!-- Admin Control Panel -->
        <section class="admin-panel" id="adminPanel">
            <h3><i class="fa-solid fa-cloud-arrow-up"></i> Firebase Upload Control</h3>
            <p style="font-size: 0.85rem; color: var(--gray); margin-bottom: 15px;">Live progress tracking & direct cloud upload</p>
            
            <div class="panel-tabs">
                <button class="tab-btn active" id="tabPostBtn">Add Feed Post</button>
                <button class="tab-btn" id="tabStoryBtn">Add Status Story</button>
            </div>

            <!-- Upload Progress Bar -->
            <div class="progress-box" id="progressBox">
                <div class="progress-bar" id="progressBar"></div>
                <div class="progress-text" id="progressText">0%</div>
            </div>

            <!-- Add Post Form -->
            <div id="postTab">
                <input type="text" id="postText" class="form-control" placeholder="Post Caption or Content...">
                <label style="font-size: 0.85rem; font-weight: 600;">Select Image File:</label>
                <input type="file" id="postImgFile" class="form-control" accept="image/*">
                <button class="btn" id="uploadPostBtn"><i class="fa-solid fa-plus"></i> Publish Post to Firebase</button>
            </div>

            <!-- Add Story Form -->
            <div id="storyTab" style="display: none;">
                <input type="text" id="storyName" class="form-control" placeholder="Status Title/User Name...">
                <label style="font-size: 0.85rem; font-weight: 600;">Select Story Image:</label>
                <input type="file" id="storyImgFile" class="form-control" accept="image/*">
                <button class="btn" id="uploadStoryBtn"><i class="fa-solid fa-upload"></i> Post Story to Firebase</button>
            </div>
        </section>

        <!-- Feed Section -->
        <section>
            <h3 style="margin-bottom: 15px;">Live Updates Feed</h3>
            <div class="feed-grid" id="feedGrid">
                <!-- Posts Rendered Here -->
            </div>
        </section>

    </main>

    <!-- Modal -->
    <div class="modal" id="storyModal">
        <div class="modal-content">
            <img src="" id="modalImg" class="modal-img">
            <h4 id="modalName" style="margin-top: 10px;">User</h4>
            <button class="btn btn-danger" style="margin-top: 15px;" id="closeModalBtn">Close</button>
        </div>
    </div>

    <!-- Firebase SDK Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getStorage, ref, uploadBytesResumable, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA1S9u1f3VOdZnP6puMhCVwAG6kwL4Vu5Q",
            authDomain: "public-361f0.firebaseapp.com",
            projectId: "public-361f0",
            storageBucket: "public-361f0.firebasestorage.app",
            messagingSenderId: "519361882049",
            appId: "1:519361882049:web:fa1d69dff9d59df4f43140",
            measurementId: "G-25WKCZG3EF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const storage = getStorage(app);

        let isAdmin = false;
        const ADMIN_PIN = "1234";

        // Admin Toggle
        document.getElementById('loginAdminBtn').addEventListener('click', () => {
            if (!isAdmin) {
                const pin = prompt("Enter Admin Secret PIN:");
                if (pin === ADMIN_PIN) {
                    isAdmin = true;
                    document.body.classList.add('admin-mode');
                    document.getElementById('adminPanel').classList.add('active');
                    document.getElementById('loginAdminBtn').innerHTML = '<i class="fa-solid fa-right-from-bracket"></i> Logout Admin';
                } else {
                    alert("Wrong Admin PIN!");
                }
            } else {
                isAdmin = false;
                document.body.classList.remove('admin-mode');
                document.getElementById('adminPanel').classList.remove('active');
                document.getElementById('loginAdminBtn').innerHTML = '<i class="fa-solid fa-lock"></i> Admin Login';
            }
        });

        // Tabs
        const tabPostBtn = document.getElementById('tabPostBtn');
        const tabStoryBtn = document.getElementById('tabStoryBtn');
        const postTab = document.getElementById('postTab');
        const storyTab = document.getElementById('storyTab');

        tabPostBtn.addEventListener('click', () => {
            postTab.style.display = 'block'; storyTab.style.display = 'none';
            tabPostBtn.classList.add('active'); tabStoryBtn.classList.remove('active');
        });

        tabStoryBtn.addEventListener('click', () => {
            postTab.style.display = 'none'; storyTab.style.display = 'block';
            tabStoryBtn.classList.add('active'); tabPostBtn.classList.remove('active');
        });

        // Upload Helper with Real-time Progress Bar
        function uploadWithProgress(file, folderPath, onSuccess, onError) {
            const progressBox = document.getElementById('progressBox');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');

            progressBox.style.display = 'block';
            progressBar.style.width = '0%';
            progressText.innerText = '0%';

            const storagePath = `${folderPath}/${Date.now()}_${file.name}`;
            const storageRef = ref(storage, storagePath);
            const uploadTask = uploadBytesResumable(storageRef, file);

            uploadTask.on('state_changed',
                (snapshot) => {
                    const progress = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    progressBar.style.width = progress + '%';
                    progressText.innerText = Math.round(progress) + '% Uploading...';
                },
                (error) => {
                    progressBox.style.display = 'none';
                    alert("Firebase Security Rules/Network Error: " + error.message);
                    if(onError) onError(error);
                },
                async () => {
                    const downloadURL = await getDownloadURL(uploadTask.snapshot.ref);
                    progressBox.style.display = 'none';
                    onSuccess(downloadURL, storagePath);
                }
            );
        }

        // Upload Story Action
        document.getElementById('uploadStoryBtn').addEventListener('click', () => {
            const name = document.getElementById('storyName').value;
            const file = document.getElementById('storyImgFile').files[0];

            if (!name || !file) {
                alert('Title aur Image file select karein!');
                return;
            }

            const btn = document.getElementById('uploadStoryBtn');
            btn.disabled = true;

            uploadWithProgress(file, 'stories', async (url, path) => {
                try {
                    await addDoc(collection(db, "stories"), {
                        name: name,
                        img: url,
                        storagePath: path,
                        timestamp: Date.now()
                    });
                    document.getElementById('storyName').value = '';
                    document.getElementById('storyImgFile').value = '';
                    alert("Story Uploaded Successfully!");
                } catch(e) {
                    alert("Firestore Database Error: " + e.message);
                } finally {
                    btn.disabled = false;
                }
            }, () => { btn.disabled = false; });
        });

        // Upload Post Action
        document.getElementById('uploadPostBtn').addEventListener('click', () => {
            const text = document.getElementById('postText').value;
            const file = document.getElementById('postImgFile').files[0];

            if (!text || !file) {
                alert('Caption aur Image file dono zaroori hain!');
                return;
            }

            const btn = document.getElementById('uploadPostBtn');
            btn.disabled = true;

            uploadWithProgress(file, 'posts', async (url, path) => {
                try {
                    await addDoc(collection(db, "posts"), {
                        author: "Tanveer Hussain",
                        text: text,
                        img: url,
                        storagePath: path,
                        timestamp: Date.now()
                    });
                    document.getElementById('postText').value = '';
                    document.getElementById('postImgFile').value = '';
                    alert("Post Published Successfully!");
                } catch(e) {
                    alert("Firestore Error: " + e.message);
                } finally {
                    btn.disabled = false;
                }
            }, () => { btn.disabled = false; });
        });

        // Real-time Stories Listener
        const storiesQuery = query(collection(db, "stories"), orderBy("timestamp", "desc"));
        onSnapshot(storiesQuery, (snapshot) => {
            const storiesWrapper = document.getElementById('storiesWrapper');
            storiesWrapper.innerHTML = '';
            snapshot.forEach((docSnap) => {
                const story = docSnap.data();
                const id = docSnap.id;

                const div = document.createElement('div');
                div.className = 'story-card';
                div.innerHTML = `
                    <button class="delete-story-btn" data-id="${id}" data-path="${story.storagePath}"><i class="fa-solid fa-xmark"></i></button>
                    <div class="story-img-wrapper">
                        <img src="${story.img}" class="story-img">
                    </div>
                    <div class="story-name">${story.name}</div>
                `;

                div.querySelector('.story-img-wrapper').addEventListener('click', () => {
                    document.getElementById('modalImg').src = story.img;
                    document.getElementById('modalName').innerText = story.name;
                    document.getElementById('storyModal').style.display = 'flex';
                });

                div.querySelector('.delete-story-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteStory(id, story.storagePath);
                });

                storiesWrapper.appendChild(div);
            });
        });

        // Real-time Posts Listener
        const postsQuery = query(collection(db, "posts"), orderBy("timestamp", "desc"));
        onSnapshot(postsQuery, (snapshot) => {
            const feedGrid = document.getElementById('feedGrid');
            feedGrid.innerHTML = '';
            snapshot.forEach((docSnap) => {
                const post = docSnap.data();
                const id = docSnap.id;
                
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-header">
                        <div class="post-info">
                            <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=80&q=80" class="post-avatar">
                            <div>
                                <strong>${post.author}</strong><br>
                                <small style="color:var(--gray);">${new Date(post.timestamp).toLocaleTimeString()}</small>
                            </div>
                        </div>
                        <button class="post-delete-btn"><i class="fa-solid fa-trash"></i> Delete</button>
                    </div>
                    <img src="${post.img}" class="post-image">
                    <div class="post-content"><p>${post.text}</p></div>
                `;

                card.querySelector('.post-delete-btn').addEventListener('click', () => {
                    deletePost(id, post.storagePath);
                });

                feedGrid.appendChild(card);
            });
        });

        // Delete Handlers
        async function deletePost(id, path) {
            if (confirm("Delete this post?")) {
                await deleteDoc(doc(db, "posts", id));
                if (path) await deleteObject(ref(storage, path)).catch(() => {});
            }
        }

        async function deleteStory(id, path) {
            if (confirm("Delete this story?")) {
                await deleteDoc(doc(db, "stories", id));
                if (path) await deleteObject(ref(storage, path)).catch(() => {});
            }
        }

        document.getElementById('closeModalBtn').addEventListener('click', () => {
            document.getElementById('storyModal').style.display = 'none';
        });
    </script>
</body>
</html>
